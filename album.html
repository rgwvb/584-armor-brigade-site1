<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="portal-body album-detail-body">
<header class="portal-nav">
  <div class="container portal-nav-inner">
    <a class="portal-brand" href="index.html">
      <div class="brand-mark">584</div>
      <div><b>裝甲第五八四旅</b><small>584 ARMOR BRIGADE</small></div>
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="開啟選單" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="portal-links" id="navLinks">
      <a href="news.html">公告</a>
      <a href="about.html">旅部資訊</a>
      <a href="units.html">單位</a>
      <a href="records.html">時間線</a>
      <a class="active" href="gallery.html">相簿</a>
      <a href="roles.html">職務</a>
      <a href="history.html">歷屆幹部</a>
    </nav>
  </div>
</header>

<main id="albumPage">
  <section class="album-detail-hero">
    <div class="album-detail-cover" id="albumHeroCover"></div>
    <div class="container album-detail-hero-content">
      <a class="album-back" href="gallery.html">← 返回活動相簿</a>
      <span class="portal-kicker" id="albumKicker">PHOTO ARCHIVE</span>
      <h1 id="albumTitle">活動相簿</h1>
      <p id="albumIntro">載入相簿中…</p>
      <div class="album-stats"><span id="albumCount">0 張照片</span><span>584 ARCHIVE</span></div>
    </div>
  </section>

  <section class="portal-section album-detail-section">
    <div class="container">
      <div class="portal-heading">
        <div><span>PHOTOS</span><h2>相片紀錄</h2></div>
      </div>
      <div class="album-photo-grid" id="albumPhotoGrid"></div>
    </div>
  </section>
</main>

<div class="album-lightbox" id="albumLightbox" aria-hidden="true">
  <button class="album-lightbox-close" type="button" aria-label="關閉">×</button>
  <button class="album-lightbox-prev" type="button" aria-label="上一張">←</button>
  <figure>
    <img id="albumLightboxImage" alt="">
    <figcaption id="albumLightboxCaption"></figcaption>
  </figure>
  <button class="album-lightbox-next" type="button" aria-label="下一張">→</button>
</div>

<footer class="portal-footer">
  <div class="container">
    <div><b>裝甲第五八四旅 · 584 Armor Brigade</b><p>非官方 ROCA Roblox 資訊展示網站</p></div>
    <div>© <span id="year"></span> 584AB</div>
  </div>
</footer>

<script src="script.js"></script>
<script>
(() => {
  const driveImg=id => "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w2000";

  const albums={
    "砲兵連":{
      kicker:"ARTILLERY COMPANY",
      intro:"砲兵連訓練、裝備、集結與活動影像紀錄。",
      cover:driveImg("1zcYyzbQWUtDGQrK_uRhIKDNev44QUTvT"),
      photos:[
        [driveImg("1zcYyzbQWUtDGQrK_uRhIKDNev44QUTvT"),"砲兵連裝備與人員集結"],
        [driveImg("1L5FuByS17j16WKdi0qBiGgpJLK0QUanf"),"砲兵連車隊集結"],
        [driveImg("1Ehr6T9w_7t0CzcAO0T1krWge1RxhXk9N"),"砲兵連裝甲車輛與人員"],
        [driveImg("1Duznb_4IwE9JUBvlJKLwV_3RJUs-y-zg"),"砲兵射擊訓練紀錄"]
      ]
    },
    "機步連":{
      kicker:"MECHANIZED INFANTRY",
      intro:"機步連日常訓練、部隊合影與聯合活動紀錄。",
      cover:"assets/images/featured-formation.png",
      photos:[
        ["assets/images/featured-formation.png","機步部隊合影"],
        ["assets/images/featured-flags.png","旗隊與典禮活動"],
        ["assets/images/featured-aviation.png","聯合協同活動"],
        ["assets/images/featured-transport.png","部隊集結紀錄"]
      ]
    },
    "戰車連":{
      kicker:"TANK COMPANY",
      intro:"戰車連車隊、裝甲單位與重大活動影像紀錄。",
      cover:"assets/images/featured-convoy.png",
      photos:[
        ["assets/images/featured-convoy.png","裝甲車隊集結"],
        ["assets/images/featured-transport.png","車隊與後勤支援"],
        ["assets/images/featured-formation.png","部隊合影"],
        ["assets/images/featured-flags.png","典禮活動紀錄"]
      ]
    },
    "聯合演訓":{
      kicker:"JOINT TRAINING",
      intro:"跨單位聯合演訓、航空協同與現地活動紀錄。",
      cover:"assets/images/featured-aviation.png",
      photos:[
        ["assets/images/featured-aviation.png","航空協同"],
        ["assets/images/featured-transport.png","聯合部隊集結"],
        ["assets/images/featured-formation.png","聯合活動合影"],
        ["assets/images/featured-convoy.png","車隊活動"],
        ["assets/images/featured-flags.png","聯合典禮紀錄"]
      ]
    },
    "國慶檢閱":{
      kicker:"NATIONAL DAY REVIEW",
      intro:"國慶檢閱、旗隊榮譽與重要活動照片紀錄。",
      cover:"assets/images/featured-flags.png",
      photos:[
        ["assets/images/featured-flags.png","國慶旗隊榮譽"],
        ["assets/images/featured-convoy.png","檢閱車隊"],
        ["assets/images/featured-formation.png","檢閱部隊合影"],
        ["assets/images/featured-transport.png","檢閱集結"]
      ]
    }
  };

  const requested=new URLSearchParams(location.search).get("album") || "砲兵連";
  const data=albums[requested] || albums["砲兵連"];
  document.title=requested+"相簿｜584";
  document.getElementById("albumTitle").textContent=requested;
  document.getElementById("albumKicker").textContent=data.kicker;
  document.getElementById("albumIntro").textContent=data.intro;
  document.getElementById("albumCount").textContent=data.photos.length+" 張照片";
  document.getElementById("albumHeroCover").style.backgroundImage="url('"+data.cover+"')";

  const grid=document.getElementById("albumPhotoGrid");
  grid.innerHTML=data.photos.map((p,i)=>`
    <button class="album-photo-item" type="button" data-index="${i}">
      <img src="${p[0]}" alt="${p[1]}" loading="${i<2?"eager":"lazy"}">
      <span><b>${p[1]}</b><small>${String(i+1).padStart(2,"0")} / ${String(data.photos.length).padStart(2,"0")}</small></span>
    </button>
  `).join("");

  const lightbox=document.getElementById("albumLightbox");
  const image=document.getElementById("albumLightboxImage");
  const caption=document.getElementById("albumLightboxCaption");
  let current=0;

  function show(index){
    current=(index+data.photos.length)%data.photos.length;
    image.src=data.photos[current][0];
    image.alt=data.photos[current][1];
    caption.textContent=data.photos[current][1]+" · "+(current+1)+" / "+data.photos.length;
    lightbox.classList.add("open");
    lightbox.setAttribute("aria-hidden","false");
    document.body.classList.add("lightbox-open");
  }
  function close(){
    lightbox.classList.remove("open");
    lightbox.setAttribute("aria-hidden","true");
    document.body.classList.remove("lightbox-open");
  }

  grid.addEventListener("click",e=>{
    const btn=e.target.closest(".album-photo-item");
    if(btn)show(Number(btn.dataset.index));
  });
  lightbox.querySelector(".album-lightbox-close").onclick=close;
  lightbox.querySelector(".album-lightbox-prev").onclick=()=>show(current-1);
  lightbox.querySelector(".album-lightbox-next").onclick=()=>show(current+1);
  lightbox.addEventListener("click",e=>{if(e.target===lightbox)close()});
  document.addEventListener("keydown",e=>{
    if(!lightbox.classList.contains("open"))return;
    if(e.key==="Escape")close();
    if(e.key==="ArrowLeft")show(current-1);
    if(e.key==="ArrowRight")show(current+1);
  });
})();
</script>
</body>
</html>
