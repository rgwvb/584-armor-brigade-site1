<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>青蛙課表</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <section id="capture-card" class="schedule-card">
      <header class="hero">
        <div class="hero-copy">
          <div class="eyebrow">CLASS SCHEDULE</div>
          <h1>📚 <span id="page-title">今日課表</span>｜<span id="weekday-label">週一</span></h1>
          <p id="date-label" class="date"></p>
          <div id="summary-pill" class="summary-pill">讀取課表中…</div>
        </div>
        <img class="frog" src="./assets/frog.svg" alt="青蛙吉祥物" />
      </header>

      <nav class="day-tabs" aria-label="選擇星期">
        <button data-day="一">一</button><button data-day="二">二</button><button data-day="三">三</button>
        <button data-day="四">四</button><button data-day="五">五</button><button data-day="六">六</button>
      </nav>

      <section id="groups" class="groups"></section>
      <footer class="footer">資料來源：OneDrive 課表.xlsx ・ 每日自動同步</footer>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
